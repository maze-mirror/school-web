name: Deploy Code Meter

on:
  push:
    branches: [main]
    paths:
      - 'apps/code-meter-web/**'
      - '!apps/code-meter-web/**/*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-code-meter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-meter-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          run_install: false
      - name: Install Code Meter dependencies
        run: pnpm --filter code-meter-web... install --frozen-lockfile
      - name: Check types
        run: pnpm --filter code-meter-web type-check
      - name: Run tests
        run: pnpm --filter code-meter-web test:unit --run
      - name: Build website
        run: pnpm --filter code-meter-web build-only --base="/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/code-meter-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
